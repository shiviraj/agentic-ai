[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Shivam Rajput", email = "example@email.com" }]
requires-python = ">=3.14"
dependencies = ["ollama>=0.6.3", "prompt-toolkit>=3.0.53", "rich>=15.0.0"]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.17.0"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["my_agent"] # always treat your package as your own code
combine-as-imports = true

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]
