[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivam Rajput", email = "example@email.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.3",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
